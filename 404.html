<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Vandressa Solos do Mar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --creme: #F6F0E8;
    --bege: #EAD9C2;
    --caramelo: #B07D3A;
    --dourado-claro: #E0B86A;
    --dourado-escuro: #8A621E;
    --marrom: #2E1A08;
    --texto: #2A1A08;
    --texto-suave: #6B4E2A;
    --branco: #FDFAF5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--creme);
    color: var(--texto);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: rgba(246,240,232,0.97);
    border-bottom: 1px solid rgba(176,125,58,.15);
    padding: 0 5vw;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .nav-logo {
    font-family: 'Cinzel', serif;
    font-size: .82rem; letter-spacing: .18em;
    color: var(--texto); text-decoration: none;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-logo-v {
    width: 32px; height: 32px;
    border: 1.5px solid var(--caramelo);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 600; color: var(--caramelo);
    flex-shrink: 0;
  }
  .nav-logo-text { display: flex; flex-direction: column; line-height: 1.35; }
  .nav-logo-sub {
    font-size: .52rem; letter-spacing: .3em;
    color: var(--caramelo); text-transform: uppercase;
    margin-top: 2px; white-space: nowrap;
  }
  @media (max-width: 580px) {
    .nav-logo { font-size: .7rem; letter-spacing: .14em; }
    .nav-logo-sub { font-size: .48rem; letter-spacing: .24em; }
  }

  /* MAIN */
  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 4rem 5vw;
    position: relative;
    overflow: hidden;
  }

  /* Número 404 decorativo ao fundo */
  main::before {
    content: '404';
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18rem, 35vw, 32rem);
    font-weight: 300;
    color: rgba(176,125,58,.06);
    line-height: 1;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .content {
    text-align: center;
    position: relative; z-index: 1;
    max-width: 560px;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: .62rem; letter-spacing: .32em;
    color: var(--caramelo); text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 1.8rem;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    width: 28px; height: 1px;
    background: var(--caramelo);
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    font-weight: 300;
    line-height: 1.15;
    color: var(--texto);
    margin-bottom: 1.2rem;
  }
  .title em { font-style: italic; color: var(--caramelo); }

  .subtitle {
    font-size: clamp(.88rem, 1.5vw, 1rem);
    font-weight: 300;
    color: var(--texto-suave);
    line-height: 1.75;
    margin-bottom: 2.8rem;
  }

  .divider {
    width: 40px; height: 1px;
    background: rgba(176,125,58,.35);
    margin: 0 auto 2.8rem;
  }

  .actions {
    display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap;
  }

  .btn-primary {
    font-family: 'Inter', sans-serif;
    font-size: .84rem; font-weight: 500;
    background: var(--caramelo); color: var(--branco);
    border: none; cursor: pointer;
    padding: 13px 28px;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .25s, transform .2s;
    border-radius: 2px;
  }
  .btn-primary:hover { background: var(--dourado-escuro); transform: translateY(-1px); }

  .btn-secondary {
    font-family: 'Inter', sans-serif;
    font-size: .84rem; font-weight: 400;
    background: transparent; color: var(--caramelo);
    border: 1.5px solid rgba(176,125,58,.45);
    cursor: pointer;
    padding: 13px 28px;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .25s;
    border-radius: 2px;
  }
  .btn-secondary:hover { border-color: var(--caramelo); background: rgba(176,125,58,.06); transform: translateY(-1px); }

  /* FOOTER */
  footer {
    background: var(--marrom);
    padding: 1.6rem 5vw;
    text-align: center;
    flex-shrink: 0;
  }
  .footer-copy {
    font-size: .73rem;
    color: rgba(232,217,192,.35);
    font-weight: 300; letter-spacing: .04em;
  }

  /* WhatsApp float */
  .whatsapp-float {
    position: fixed; bottom: 26px; right: 26px; z-index: 200;
    width: 54px; height: 54px;
    background: #25D366; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(37,211,102,.38);
    transition: transform .25s, box-shadow .25s;
    animation: wapulse 2.8s infinite;
  }
  .whatsapp-float:hover { transform: scale(1.1); }
  .whatsapp-float svg { width: 26px; height: 26px; fill: white; }

  @keyframes wapulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(37,211,102,.38), 0 0 0 0 rgba(37,211,102,.25); }
    50%       { box-shadow: 0 4px 20px rgba(37,211,102,.38), 0 0 0 10px rgba(37,211,102,0); }
  }

  @media (max-width: 500px) {
    .actions { flex-direction: column; align-items: center; }
    .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-v">V</div>
    <span class="nav-logo-text">
      VANDRESSA SOLOS DO MAR
      <span class="nav-logo-sub">Advogada em Fortaleza</span>
    </span>
  </a>
</nav>

<main>
  <div class="content">
    <div class="eyebrow">Erro 404</div>

    <h1 class="title">
      Página não<br><em>encontrada</em>
    </h1>

    <p class="subtitle">
      O endereço que você acessou não existe ou foi removido.<br>
      Mas seu direito pode estar esperando por você.
    </p>

    <div class="divider"></div>

    <div class="actions">
      <a href="/" class="btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
        Voltar ao início
      </a>
      <a href="/#atendimento" class="btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Verificar meu direito
      </a>
    </div>
  </div>
</main>

<footer>
  <p class="footer-copy">© 2026 Vandressa Solos do Mar Advocacia · OAB/CE 46.161</p>
</footer>
