# Configuração do site / blog Jekyll
title: Vandressa Solos do Mar
tagline: Advogada Previdenciária em Fortaleza
description: >-
  Advogada especialista em INSS, benefícios previdenciários e direito da saúde.
  Atendimento humanizado em Fortaleza/CE e todo o Brasil. OAB/CE 46.161.
url: "https://advsolosdomar.com.br"
lang: pt_BR
timezone: America/Fortaleza

author:
  name: Vandressa Solos do Mar

logo: /nova1.webp
social:
  name: Vandressa Solos do Mar
  links:
    - https://www.instagram.com/adv.solosdomar

# URLs dos posts: advsolosdomar.com.br/blog/nome-do-post/
permalink: /blog/:title/

# ── PUBLICAÇÃO AGENDADA ─────────────────────────────────────────────
# future: false  =>  post com data futura NÃO entra no site.
# O site é reconstruído todos os dias pelo GitHub Actions
# (.github/workflows/publicar-agendado.yml), então cada post do blog
# aparece sozinho, na madrugada da data escrita no nome do arquivo.
# NUNCA mude para true: isso publicaria todos os posts agendados de uma vez.
future: false
unpublished: false

markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  posts_limit: 20

# Supabase do blog (comentários + visualizações) — projeto próprio da Vandressa.
# Preencha após rodar supabase/blog-admin.sql (Project Settings -> API).
# Enquanto vazio, o site funciona normalmente, sem comentários nem contador.
supabase_url: "https://afuitmdzswmogngogcbf.supabase.co"
supabase_anon_key: "sb_publishable_vM2CwkPiL5iIBSpmd6Y6lA_Xzt4QRzH"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      image: /nova1.webp
      author: Vandressa Solos do Mar

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
