# ─────────────────────────────────────────────────────────────────────────────
#  Publicação agendada do blog — advsolosdomar.com.br
#
#  Por que este arquivo existe:
#  O Jekyll está com `future: false`, ou seja, um post com data futura não
#  entra no site. Mas o GitHub Pages só reconstrói o site quando alguém faz um
#  push. Sem este workflow, os posts agendados NUNCA apareceriam sozinhos.
#
#  Este workflow reconstrói e republica o site duas vezes por dia. Na primeira
#  execução após a meia-noite (horário de Fortaleza) da data do post, o Jekyll
#  passa a enxergá-lo e ele aparece no /blog/, no sitemap e no feed RSS.
#
#  IMPORTANTE — configuração única no GitHub (sem isso, nada disso funciona):
#  Settings > Pages > Build and deployment > Source = "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────────

name: Publicar site (com posts agendados)

on:
  push:
    branches: [main, master]
  schedule:
    # Cron do GitHub é sempre em UTC. Fortaleza = UTC-3.
    - cron: "5 3 * * *"    # 00:05 em Fortaleza — libera o post do dia
    - cron: "5 15 * * *"   # 12:05 em Fortaleza — rede de segurança
  workflow_dispatch:        # permite publicar na mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir o site (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Enviar o site construído
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
